name: 更新台股收盤價與除權息

on:
  schedule:
    # cron 用 UTC，台北 = UTC+8。收盤 13:30，但證交所資料上架時間不定，
    # 因此傍晚到深夜多跑幾次；沒有變動就不會 commit，成本很低。
    - cron: "30 7 * * 1-5"    # 台北 15:30
    - cron: "0 10 * * 1-5"    # 台北 18:00
    - cron: "0 13 * * 1-5"    # 台北 21:00
    - cron: "0 16 * * 1-5"    # 台北 00:00（隔日）
  workflow_dispatch: # 允許在 Actions 頁面手動按按鈕執行

permissions:
  contents: write

concurrency:
  group: update-prices
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: 取得原始碼
        uses: actions/checkout@v4

      - name: 設定 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 抓取收盤行情
        run: python scripts/fetch_prices.py

      - name: 累積除權息紀錄
        run: python scripts/fetch_dividends.py
        continue-on-error: true

      - name: 有更新才 commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- prices.json dividends.json; then
            echo "資料沒有變化，略過 commit"
          else
            git add prices.json dividends.json
            git commit -m "更新收盤價與除權息 $(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M')"
            git push
          fi
