<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>持股帳本</title>
<meta name="theme-color" content="#10141c">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#10141c; --panel:#1a2130; --panel-alt:#212939; --line:#2e3648;
    --text:#eceff4; --muted:#8b95a8; --gold:#c9a24b; --gold-dim:#8a7238;
    --gain:#4ade9c; --loss:#ff6b6b; --div:#6fb3d9;
    --font-display:'Space Grotesk','Noto Sans TC',sans-serif;
    --font-body:'Noto Sans TC',-apple-system,'PingFang TC',sans-serif;
    --font-mono:'IBM Plex Mono',ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace;
  }
  *{ box-sizing:border-box; }
  body{ margin:0; background:var(--bg); color:var(--text); font-family:var(--font-body);
        min-height:100vh; -webkit-text-size-adjust:100%; }

  .ticker-wrap{ overflow:hidden; white-space:nowrap; background:var(--panel);
                border-bottom:1px solid var(--line); padding:7px 0; }
  .ticker-track{ display:inline-block; white-space:nowrap; animation:scroll-left 32s linear infinite;
                 font-family:var(--font-mono); font-size:12px; letter-spacing:.03em; color:var(--muted); }
  .ticker-track span{ margin-right:34px; }
  .ticker-track .t-code{ color:var(--gold); font-weight:600; }
  @keyframes scroll-left{ from{transform:translateX(0);} to{transform:translateX(-50%);} }
  @media (prefers-reduced-motion:reduce){ .ticker-track{ animation:none; } }

  .wrap{ max-width:1140px; margin:0 auto; padding:28px 20px 80px; }
  .masthead{ display:flex; align-items:baseline; justify-content:space-between; gap:12px;
             flex-wrap:wrap; margin-bottom:20px; border-bottom:1px solid var(--line); padding-bottom:16px; }
  .masthead h1{ font-family:var(--font-display); font-size:26px; font-weight:700; margin:0; }
  .masthead .dot{ display:inline-block; width:7px; height:7px; border-radius:50%;
                  background:var(--gain); margin-right:9px; box-shadow:0 0 0 3px rgba(74,222,156,.15); }
  .quote-status{ font-family:var(--font-mono); font-size:11.5px; color:var(--muted);
                 display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .quote-status .badge{ border:1px solid var(--line); border-radius:4px; padding:2px 7px; color:var(--gold); }
  .quote-status.stale .badge{ color:var(--muted); }

  .summary{ display:grid; grid-template-columns:repeat(4,1fr); background:var(--panel);
            border:1px solid var(--line); border-radius:10px; overflow:hidden; margin-bottom:14px; }
  .stat{ padding:16px 18px; border-right:1px solid var(--line); }
  .stat:last-child{ border-right:none; }
  .stat .label{ font-size:11.5px; color:var(--muted); letter-spacing:.04em; margin-bottom:8px; }
  .stat .value{ font-family:var(--font-mono); font-size:22px; font-weight:600;
                display:flex; align-items:center; gap:6px; }
  .stat .value.gain{ color:var(--gain); } .stat .value.loss{ color:var(--loss); }
  .stat .value.neutral{ color:var(--text); } .stat .value.div{ color:var(--div); }
  .arrow{ font-size:14px; }

  .mode-bar{ display:flex; align-items:center; gap:10px; margin-bottom:26px;
             font-size:12px; color:var(--muted); flex-wrap:wrap; }
  .toggle{ display:inline-flex; border:1px solid var(--line); border-radius:6px; overflow:hidden; }
  .toggle button{ background:transparent; border:none; color:var(--muted); font-family:var(--font-body);
                  font-size:12px; padding:6px 14px; cursor:pointer; transition:background .15s,color .15s; }
  .toggle button.active{ background:var(--gold); color:#1a1406; font-weight:700; }
  .toggle button:focus-visible{ outline:2px solid var(--gold); outline-offset:-2px; }

  section{ margin-bottom:30px; }
  .section-title{ font-family:var(--font-display); font-size:15px; font-weight:700; color:var(--gold);
                  margin-bottom:12px; display:flex; align-items:center; gap:8px; }
  .section-title::before{ content:""; width:3px; height:14px; background:var(--gold); display:inline-block; }

  .form-card{ background:var(--panel-alt); border:1px solid var(--line); border-radius:10px; padding:18px; }
  .form-grid{ display:grid; grid-template-columns:105px 1fr 95px 110px 140px auto; gap:10px; align-items:end; }
  .field label{ display:block; font-size:11px; color:var(--muted); margin-bottom:6px; letter-spacing:.03em; }
  .field input{ width:100%; background:var(--bg); border:1px solid var(--line); border-radius:6px;
                color:var(--text); font-family:var(--font-mono); font-size:15px; padding:9px 10px;
                transition:border-color .15s; }
  .field input:focus{ outline:none; border-color:var(--gold-dim); }
  .field input[type=date]{ font-size:13px; color-scheme:dark; }
  .name-tag{ height:40px; display:flex; align-items:center; gap:8px; font-size:14px; padding:0 2px; }
  .name-tag.unknown{ color:var(--muted); font-style:italic; }
  .market-chip{ font-family:var(--font-mono); font-size:10px; color:var(--muted);
                border:1px solid var(--line); border-radius:3px; padding:1px 5px; }
  .add-btn{ background:var(--gold); color:#1a1406; border:none; border-radius:6px; padding:0 18px;
            font-family:var(--font-body); font-weight:700; font-size:13px; cursor:pointer;
            white-space:nowrap; height:40px; transition:filter .15s; }
  .add-btn:hover{ filter:brightness(1.1); }
  .add-btn:focus-visible,.del-btn:focus-visible,.reset-btn:focus-visible{ outline:2px solid var(--gold); outline-offset:2px; }
  .hint{ font-size:11.5px; color:var(--muted); margin-top:10px; line-height:1.65; }

  table{ width:100%; border-collapse:collapse; background:var(--panel);
         border:1px solid var(--line); border-radius:10px; overflow:hidden; }
  thead th{ text-align:right; font-size:11px; font-weight:600; color:var(--muted); letter-spacing:.03em;
            padding:10px 12px; border-bottom:1px solid var(--line); background:var(--panel-alt); white-space:nowrap; }
  thead th.left{ text-align:left; }
  tbody td{ text-align:right; padding:11px 12px; font-family:var(--font-mono); font-size:13px;
            border-bottom:1px solid var(--line); white-space:nowrap; }
  tbody tr:last-child td{ border-bottom:none; }
  tbody td.left{ text-align:left; font-family:var(--font-body); }
  .code-cell{ color:var(--gold); font-weight:600; }
  .gain-text{ color:var(--gain); } .loss-text{ color:var(--loss); } .div-text{ color:var(--div); }

  tr.group-row{ background:var(--panel-alt); cursor:pointer; }
  tr.group-row:hover{ background:rgba(201,162,75,.08); }
  tr.group-row td{ font-weight:600; }
  tr.group-row .code-cell{ display:flex; align-items:center; gap:7px; }
  .toggle-chevron{ display:inline-block; color:var(--gold); font-size:10px;
                   transition:transform .15s; width:10px; }
  tr.group-row.collapsed .toggle-chevron{ transform:rotate(-90deg); }
  .muted-cell{ color:var(--muted); }
  tr.detail-row td{ color:var(--text); font-weight:400; }
  tr.detail-row .code-cell{ padding-left:26px; color:var(--muted); font-weight:400; }
  tr.detail-row .name-sub{ display:block; font-size:10.5px; color:var(--muted);
                           font-family:var(--font-mono); margin-top:2px; }
  tr.detail-row.hidden-row{ display:none; }

  .cell-flex{ display:flex; align-items:center; justify-content:flex-end; gap:5px; }
  .edit-input{ width:74px; background:transparent; border:none; border-bottom:1px dashed var(--line);
               color:var(--text); font-family:var(--font-mono); font-size:13px; text-align:right; padding:2px 4px; }
  .edit-input:focus{ outline:none; border-bottom:1px solid var(--gold-dim); }
  .edit-input.auto{ color:var(--muted); }
  .src-chip{ font-size:9px; font-family:var(--font-mono); border-radius:3px; padding:1px 4px;
             border:1px solid var(--line); color:var(--muted); }
  .src-chip.manual{ color:var(--gold); border-color:var(--gold-dim); }
  .reset-btn{ background:none; border:none; color:var(--muted); cursor:pointer; font-size:12px; padding:0 2px; }
  .reset-btn:hover{ color:var(--gold); }
  .del-btn{ background:none; border:none; color:var(--muted); cursor:pointer; font-size:15px; padding:2px 6px; }
  .del-btn:hover{ color:var(--loss); }
  .empty-row td{ text-align:center; color:var(--muted); font-family:var(--font-body);
                 padding:26px 14px; white-space:normal; }
  .table-scroll{ overflow-x:auto; -webkit-overflow-scrolling:touch; }

  @media (max-width:820px){
    .wrap{ padding:20px 14px 60px; }
    .form-grid{ grid-template-columns:1fr 1fr; }
    .form-grid .add-btn{ grid-column:1/-1; width:100%; }
    .summary{ grid-template-columns:1fr 1fr; }
    .stat{ border-bottom:1px solid var(--line); }
    .stat:nth-child(2n){ border-right:none; }
    .stat .value{ font-size:19px; }
  }
</style>
</head>
<body>

<div class="ticker-wrap"><div class="ticker-track" id="tickerTrack"></div></div>

<div class="wrap">
  <div class="masthead">
    <h1><span class="dot"></span>持股帳本</h1>
    <div class="quote-status" id="quoteStatus"><span class="badge">報價載入中</span></div>
  </div>

  <div class="summary">
    <div class="stat">
      <div class="label">總投入金額</div>
      <div class="value neutral" id="sumInvested">$0</div>
    </div>
    <div class="stat">
      <div class="label">累計配息</div>
      <div class="value div" id="sumDividend">$0</div>
    </div>
    <div class="stat">
      <div class="label" id="labelGain">總收益金額</div>
      <div class="value neutral" id="sumGain">$0</div>
    </div>
    <div class="stat">
      <div class="label" id="labelRate">總收益率</div>
      <div class="value neutral" id="sumRate">0.00%</div>
    </div>
  </div>

  <div class="mode-bar">
    <span>報酬計算方式</span>
    <span class="toggle">
      <button id="modeTotal" class="active">含息</button>
      <button id="modePrice">只算價差</button>
    </span>
    <span id="modeNote">收益金額與收益率已計入配息</span>
  </div>

  <section>
    <div class="section-title">新增持股</div>
    <div class="form-card">
      <div class="form-grid">
        <div class="field">
          <label for="inCode">股票代號</label>
          <input type="text" id="inCode" placeholder="2330" maxlength="10" inputmode="numeric" autocomplete="off">
        </div>
        <div class="field">
          <label>名稱</label>
          <div class="name-tag unknown" id="namePreview">請輸入代號</div>
        </div>
        <div class="field">
          <label for="inShares">股數</label>
          <input type="number" id="inShares" placeholder="1000" min="0" inputmode="numeric">
        </div>
        <div class="field">
          <label for="inBuyPrice">買入價格</label>
          <input type="number" id="inBuyPrice" placeholder="580.00" min="0" step="0.01" inputmode="decimal">
        </div>
        <div class="field">
          <label for="inBuyDate">買入日期</label>
          <input type="date" id="inBuyDate">
        </div>
        <button class="add-btn" id="addBtn">+ 新增持股</button>
      </div>
      <div class="field" id="customNameField" style="display:none; margin-top:12px; max-width:240px;">
        <label for="inCustomName">找不到這個代號，請自行輸入名稱</label>
        <input type="text" id="inCustomName" placeholder="輸入名稱">
      </div>
      <div class="hint">
        買入日期用來判斷哪幾次除息你有領到，留空的話配息只能手動填。目前價格與累計配息都會自動帶入，
        直接在表格輸入即可覆寫成手動值，按 ↺ 還原自動計算。
      </div>
    </div>
  </section>

  <section>
    <div class="section-title">持股明細</div>
    <div class="hint" style="margin-top:0; margin-bottom:10px;">每個代號上方為統整列，點擊可展開或收合底下的各筆買入紀錄。</div>
    <div class="table-scroll">
      <table>
        <thead>
          <tr>
            <th class="left">代號</th>
            <th class="left">名稱</th>
            <th>股數</th>
            <th>買入價格</th>
            <th>目前價格</th>
            <th>總價金</th>
            <th>累計配息</th>
            <th>收益金額</th>
            <th>收益率</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="lotsBody"></tbody>
      </table>
    </div>
  </section>
</div>

<script>
"use strict";

const STORAGE_KEY = "lots";
const MODE_KEY = "returnMode";
const PRICES_URL = "prices.json";
const DIVIDENDS_URL = "dividends.json";

let lots = [];
let priceMap = {};       // code -> {name, close, change, market}
let divEvents = [];      // [{code, name, exDate, cash, stock}]
let divByCode = {};      // code -> [events]
let includeDividend = true;
const collapsedCodes = new Set();

/* ---------- 格式化 ---------- */
const fmtMoney = n => (n < 0 ? "-" : "") + "$" + Math.abs(Math.round(n)).toLocaleString("en-US");
const fmtRate  = n => (n > 0 ? "+" : "") + n.toFixed(2) + "%";
const gainClass = n => n > 0 ? "gain-text" : (n < 0 ? "loss-text" : "");
const arrow = n => n > 0 ? "▲" : (n < 0 ? "▼" : "—");
const escapeHtml = s => String(s).replace(/[&<>"']/g,
  c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

/* ---------- 報價與配息 ---------- */
const lookupQuote = code => priceMap[code] || null;
const lookupName  = code => { const q = lookupQuote(code); return q && q.name ? q.name : null; };

function effectivePrice(lot){
  if(lot.override !== null && lot.override !== undefined) return lot.override;
  const q = lookupQuote(lot.code);
  if(q && typeof q.close === "number") return q.close;
  return lot.buyPrice;
}
function priceSource(lot){
  if(lot.override !== null && lot.override !== undefined) return "manual";
  const q = lookupQuote(lot.code);
  return (q && typeof q.close === "number") ? "auto" : "none";
}

/** 自動配息：除息日在買入日當天或之後的事件才算領得到 */
function autoDividend(lot){
  if(!lot.buyDate) return 0;
  const events = divByCode[lot.code];
  if(!events) return 0;
  return events.reduce((sum, ev) => {
    if(ev.exDate >= lot.buyDate && ev.cash > 0) return sum + ev.cash * lot.shares;
    return sum;
  }, 0);
}
function effectiveDividend(lot){
  if(lot.dividend !== null && lot.dividend !== undefined) return lot.dividend;
  return autoDividend(lot);
}
function dividendSource(lot){
  if(lot.dividend !== null && lot.dividend !== undefined) return "manual";
  if(!lot.buyDate) return "none";
  return autoDividend(lot) > 0 ? "auto" : "empty";
}

function computeLot(lot){
  const price = effectivePrice(lot);
  const totalCost = lot.shares * lot.buyPrice;
  const priceGain = (price - lot.buyPrice) * lot.shares;
  const dividend = effectiveDividend(lot);
  const gain = includeDividend ? priceGain + dividend : priceGain;
  const rate = totalCost > 0 ? (gain / totalCost) * 100 : 0;
  return { price, totalCost, priceGain, dividend, gain, rate };
}

/* ---------- 載入外部資料 ---------- */
async function loadJson(url){
  const res = await fetch(url + "?t=" + Date.now(), { cache: "no-store" });
  if(!res.ok) throw new Error("HTTP " + res.status);
  return res.json();
}

async function loadPrices(){
  const el = document.getElementById("quoteStatus");
  let priceOk = false, priceInfo = "", divInfo = "";

  try{
    const data = await loadJson(PRICES_URL);
    priceMap = data.prices || {};
    if(data.tradeDate && data.count > 0){
      priceOk = true;
      priceInfo = `<span class="badge">收盤價 ${escapeHtml(data.tradeDate)}</span>` +
                  `<span>${data.count.toLocaleString("en-US")} 檔可自動報價</span>`;
    } else {
      priceInfo = `<span class="badge">尚無報價</span><span>等待第一次排程更新</span>`;
    }
  }catch(e){
    priceMap = {};
    priceInfo = `<span class="badge">報價無法載入</span><span>價格請手動輸入</span>`;
  }

  try{
    const data = await loadJson(DIVIDENDS_URL);
    divEvents = data.events || [];
    divByCode = {};
    divEvents.forEach(ev => {
      (divByCode[ev.code] = divByCode[ev.code] || []).push(ev);
    });
    if(divEvents.length > 0) divInfo = `<span>除息紀錄 ${divEvents.length} 筆</span>`;
  }catch(e){
    divEvents = []; divByCode = {};
  }

  el.className = "quote-status" + (priceOk ? "" : " stale");
  el.innerHTML = priceInfo + divInfo;
}

/* ---------- 儲存 ---------- */
function migrate(list){
  return list.map(l => {
    const out = Object.assign({}, l);
    if(!Object.prototype.hasOwnProperty.call(out, "override")){
      const had = typeof out.curPrice === "number" && out.curPrice !== out.buyPrice;
      out.override = had ? out.curPrice : null;
      delete out.curPrice;
    }
    if(!Object.prototype.hasOwnProperty.call(out, "dividend")) out.dividend = null;
    if(!Object.prototype.hasOwnProperty.call(out, "buyDate")) out.buyDate = null;
    return out;
  });
}
function loadLots(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    lots = raw ? migrate(JSON.parse(raw)) : [];
  }catch(e){ lots = []; }
  try{
    includeDividend = localStorage.getItem(MODE_KEY) !== "price";
  }catch(e){ includeDividend = true; }
}
function save(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(lots)); }
  catch(e){ console.error("儲存失敗", e); }
}
function saveMode(){
  try{ localStorage.setItem(MODE_KEY, includeDividend ? "total" : "price"); }catch(e){}
}

/* ---------- 畫面 ---------- */
function render(){
  let invested = 0, dividends = 0, gain = 0;
  lots.forEach(l => {
    const c = computeLot(l);
    invested += c.totalCost; dividends += c.dividend; gain += c.gain;
  });
  const rate = invested > 0 ? (gain / invested) * 100 : 0;

  document.getElementById("sumInvested").textContent = fmtMoney(invested);
  document.getElementById("sumDividend").textContent = fmtMoney(dividends);

  const gEl = document.getElementById("sumGain");
  gEl.textContent = fmtMoney(gain);
  gEl.className = "value " + (gain > 0 ? "gain" : gain < 0 ? "loss" : "neutral");

  const rEl = document.getElementById("sumRate");
  rEl.innerHTML = fmtRate(rate) + ` <span class="arrow">${arrow(rate)}</span>`;
  rEl.className = "value " + (rate > 0 ? "gain" : rate < 0 ? "loss" : "neutral");

  document.getElementById("labelGain").textContent = includeDividend ? "總收益金額（含息）" : "總收益金額（價差）";
  document.getElementById("labelRate").textContent = includeDividend ? "總收益率（含息）" : "總收益率（價差）";
  document.getElementById("modeTotal").className = includeDividend ? "active" : "";
  document.getElementById("modePrice").className = includeDividend ? "" : "active";
  document.getElementById("modeNote").textContent = includeDividend
    ? "收益金額與收益率已計入配息" : "收益金額與收益率只計價差，配息另計";

  const body = document.getElementById("lotsBody");
  body.innerHTML = "";
  if(lots.length === 0){
    body.innerHTML = `<tr class="empty-row"><td colspan="10">尚未新增任何持股，於上方輸入代號開始建立庫存。</td></tr>`;
    buildTicker();
    return;
  }

  const order = [], groups = {};
  lots.forEach(l => {
    if(!groups[l.code]){
      groups[l.code] = { code:l.code, name:l.name, shares:0, totalCost:0,
                         currentValue:0, dividend:0, lots:[] };
      order.push(l.code);
    }
    const c = computeLot(l), g = groups[l.code];
    g.shares += l.shares; g.totalCost += c.totalCost;
    g.currentValue += c.price * l.shares; g.dividend += c.dividend;
    g.lots.push(l);
    const fresh = lookupName(l.code);
    if(fresh) g.name = fresh;
  });

  order.forEach(code => {
    const g = groups[code];
    const gGain = (g.currentValue - g.totalCost) + (includeDividend ? g.dividend : 0);
    const gRate = g.totalCost > 0 ? (gGain / g.totalCost) * 100 : 0;
    const collapsed = collapsedCodes.has(code);

    const tr = document.createElement("tr");
    tr.className = "group-row" + (collapsed ? " collapsed" : "");
    tr.innerHTML = `
      <td class="left"><span class="code-cell"><span class="toggle-chevron">▾</span>${escapeHtml(g.code)}</span></td>
      <td class="left">${escapeHtml(g.name)}</td>
      <td>${g.shares.toLocaleString("en-US")}</td>
      <td class="muted-cell">—</td>
      <td class="muted-cell">—</td>
      <td>${fmtMoney(g.totalCost)}</td>
      <td class="${g.dividend > 0 ? "div-text" : "muted-cell"}">${fmtMoney(g.dividend)}</td>
      <td class="${gainClass(gGain)}">${fmtMoney(gGain)}</td>
      <td class="${gainClass(gGain)}">${fmtRate(gRate)}</td>
      <td></td>`;
    tr.addEventListener("click", () => {
      collapsedCodes.has(code) ? collapsedCodes.delete(code) : collapsedCodes.add(code);
      render();
    });
    body.appendChild(tr);

    g.lots.forEach(l => {
      const c = computeLot(l);
      const pSrc = priceSource(l), dSrc = dividendSource(l);
      const pChip = pSrc === "manual"
        ? `<span class="src-chip manual">手動</span><button class="reset-btn" data-resetprice="${l.id}" title="還原自動報價">↺</button>`
        : `<span class="src-chip">${pSrc === "auto" ? "自動" : "無報價"}</span>`;
      const dChip = dSrc === "manual"
        ? `<span class="src-chip manual">手動</span><button class="reset-btn" data-resetdiv="${l.id}" title="還原自動計算">↺</button>`
        : `<span class="src-chip">${dSrc === "auto" ? "自動" : (dSrc === "none" ? "缺日期" : "無紀錄")}</span>`;

      const row = document.createElement("tr");
      row.className = "detail-row" + (collapsed ? " hidden-row" : "");
      row.innerHTML = `
        <td class="left"><span class="code-cell">${escapeHtml(l.code)}</span></td>
        <td class="left">${escapeHtml(l.name)}
          <span class="name-sub">${l.buyDate ? escapeHtml(l.buyDate) + " 買入" : "未填買入日期"}</span></td>
        <td>${l.shares.toLocaleString("en-US")}</td>
        <td>${l.buyPrice.toFixed(2)}</td>
        <td><span class="cell-flex">
          <input class="edit-input ${pSrc === "auto" ? "auto" : ""}" type="number" step="0.01"
                 value="${c.price}" data-price="${l.id}" inputmode="decimal">${pChip}</span></td>
        <td>${fmtMoney(c.totalCost)}</td>
        <td><span class="cell-flex">
          <input class="edit-input ${dSrc !== "manual" ? "auto" : ""}" type="number" step="1"
                 value="${Math.round(c.dividend)}" data-div="${l.id}" inputmode="decimal">${dChip}</span></td>
        <td class="${gainClass(c.gain)}">${fmtMoney(c.gain)}</td>
        <td class="${gainClass(c.gain)}">${fmtRate(c.rate)}</td>
        <td><button class="del-btn" data-del="${l.id}" title="刪除這筆">✕</button></td>`;
      body.appendChild(row);
    });
  });

  bindRowEvents();
  buildTicker();
}

const findLot = id => lots.find(x => String(x.id) === String(id));

function bindRowEvents(){
  document.querySelectorAll(".edit-input").forEach(inp => {
    inp.addEventListener("click", e => e.stopPropagation());
    inp.addEventListener("change", e => {
      const t = e.target;
      const lot = findLot(t.dataset.price || t.dataset.div);
      if(!lot) return;
      const val = parseFloat(t.value);
      if(t.dataset.price) lot.override = isNaN(val) ? null : val;
      else lot.dividend = isNaN(val) ? null : val;
      save(); render();
    });
  });
  document.querySelectorAll("[data-resetprice]").forEach(b => {
    b.addEventListener("click", e => {
      e.stopPropagation();
      const lot = findLot(e.currentTarget.dataset.resetprice);
      if(lot){ lot.override = null; save(); render(); }
    });
  });
  document.querySelectorAll("[data-resetdiv]").forEach(b => {
    b.addEventListener("click", e => {
      e.stopPropagation();
      const lot = findLot(e.currentTarget.dataset.resetdiv);
      if(lot){ lot.dividend = null; save(); render(); }
    });
  });
  document.querySelectorAll("[data-del]").forEach(b => {
    b.addEventListener("click", e => {
      e.stopPropagation();
      const id = e.currentTarget.dataset.del;
      lots = lots.filter(x => String(x.id) !== String(id));
      save(); render();
    });
  });
}

function buildTicker(){
  const track = document.getElementById("tickerTrack");
  if(lots.length === 0){
    track.innerHTML = `<span>尚無持股資料 — 於下方新增你的第一筆股票</span>`;
    return;
  }
  const seen = {};
  lots.forEach(l => { if(!seen[l.code]) seen[l.code] = l.name; });
  let html = "";
  Object.keys(seen).forEach(code => {
    const rows = lots.filter(x => x.code === code);
    const cost = rows.reduce((s,x) => s + x.shares * x.buyPrice, 0);
    let val = rows.reduce((s,x) => s + x.shares * effectivePrice(x), 0);
    if(includeDividend) val += rows.reduce((s,x) => s + effectiveDividend(x), 0);
    const r = cost > 0 ? ((val - cost) / cost * 100) : 0;
    html += `<span><span class="t-code">${escapeHtml(code)}</span> ${escapeHtml(lookupName(code) || seen[code])} ${fmtRate(r)} ${arrow(r)}</span>`;
  });
  track.innerHTML = html + html;
}

/* ---------- 表單 ---------- */
const inCode = document.getElementById("inCode");
const namePreview = document.getElementById("namePreview");
const customField = document.getElementById("customNameField");
const inCustomName = document.getElementById("inCustomName");

function updateNamePreview(){
  const code = inCode.value.trim();
  if(!code){
    namePreview.textContent = "請輸入代號";
    namePreview.className = "name-tag unknown";
    customField.style.display = "none";
    return;
  }
  const q = lookupQuote(code);
  if(q && q.name){
    namePreview.innerHTML = `${escapeHtml(q.name)}<span class="market-chip">${escapeHtml(q.market || "")}</span>` +
      (typeof q.close === "number" ? `<span class="market-chip">收盤 ${q.close}</span>` : "");
    namePreview.className = "name-tag";
    customField.style.display = "none";
  } else {
    namePreview.textContent = "查無此代號";
    namePreview.className = "name-tag unknown";
    customField.style.display = "";
  }
}
inCode.addEventListener("input", updateNamePreview);

document.getElementById("addBtn").addEventListener("click", () => {
  const code = inCode.value.trim();
  const shares = parseFloat(document.getElementById("inShares").value);
  const buyPrice = parseFloat(document.getElementById("inBuyPrice").value);
  const buyDate = document.getElementById("inBuyDate").value || null;

  if(!code || !shares || shares <= 0 || !buyPrice || buyPrice <= 0){
    alert("請完整輸入股票代號、股數與買入價格");
    return;
  }
  lots.push({
    id: Date.now() + "-" + Math.random().toString(36).slice(2,8),
    code,
    name: lookupName(code) || inCustomName.value.trim() || code,
    shares, buyPrice, buyDate,
    override: null, dividend: null
  });
  save(); render();

  inCode.value = "";
  document.getElementById("inShares").value = "";
  document.getElementById("inBuyPrice").value = "";
  inCustomName.value = "";
  updateNamePreview();
  inCode.focus();
});

document.getElementById("modeTotal").addEventListener("click", () => {
  includeDividend = true; saveMode(); render();
});
document.getElementById("modePrice").addEventListener("click", () => {
  includeDividend = false; saveMode(); render();
});

/* ---------- 啟動 ---------- */
(async function init(){
  loadLots();
  render();
  await loadPrices();
  render();
  updateNamePreview();
})();
</script>
</body>
