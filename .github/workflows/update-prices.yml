name: 更新台股收盤價與除權息

on:
  schedule:
    # cron 用 UTC，台北 = UTC+8。收盤 13:30，但證交所資料上架時間不定，
    # 因此傍晚到深夜多跑幾次；沒有變動就不會 commit，成本很低。
    - cron: "30 7 * * 1-5"    # 台北 15:30
    - cron: "0 10 * * 1-5"    # 台北 18:00
    - cron: "0 13 * * 1-5"    # 台北 21:00
    - cron: "0 16 * * 1-5"    # 台北 00:00（隔日）
  workflow_dispatch: # 允許在 Actions 頁面手動按按鈕執行

permissions:
  contents: write

concurrency:
  group: update-prices
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: 取得原始碼
        uses: actions/checkout@v4

      - name: 設定 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 抓取收盤行情
        run: python scripts/fetch_prices.py

      - name: 累積除權息紀錄
        run: python scripts/fetch_dividends.py
        continue-on-error: true

      - name: 有更新才 commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- prices.json dividends.json; then
            echo "資料沒有變化，略過 commit"
          else
            git add prices.json dividends.json
            git commit -m "更新收盤價與除權息 $(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M')"
            git push
          fi

      # Supabase 免費方案閒置 7 天會暫停專案，順手戳一下保持喚醒。
      # 用的是公開的 anon key，RLS 會擋掉實際資料，只是製造一次請求。
      - name: 喚醒 Supabase
        continue-on-error: true
        run: |
          URL=$(grep -oP 'SUPABASE_URL\s*=\s*"\K[^"]*' config.js || true)
          KEY=$(grep -oP 'SUPABASE_ANON_KEY\s*=\s*"\K[^"]*' config.js || true)
          if [ -z "$URL" ] || [ -z "$KEY" ]; then
            echo "config.js 尚未填入設定，略過"
            exit 0
          fi
          CODE=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY" \
            "$URL/rest/v1/holdings?select=id&limit=1")
          echo "Supabase 回應 $CODE"
