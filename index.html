<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>持股存摺</title>
<meta name="theme-color" content="#E8EEE7">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@700;900&display=swap" rel="stylesheet">
<style>
  :root{
    /* 防偽紙、印刷墨、台股紅漲綠跌 */
    --paper:      #e8eee7;
    --paper-lit:  #f2f6f1;
    --paper-deep: #dde5dc;
    --rule:       #c2cfc3;
    --rule-fine:  #d6dfd6;
    --ink:        #1b2620;
    --ink-soft:   #63736a;
    --rise:       #c0392b;
    --fall:       #1b6b4c;
    --stamp:      #2e4a7d;

    --serif: 'Noto Serif TC', serif;
    --sans:  'Noto Sans TC', -apple-system, 'PingFang TC', sans-serif;
    --mono:  'DM Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
  }
  *{ box-sizing: border-box; }
  html{ -webkit-text-size-adjust: 100%; }
  body{
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 15px;
    line-height: 1.6;
  }

  .sheet{
    max-width: 1080px;
    margin: 0 auto;
    padding: 0 20px 96px;
  }

  /* ── 抬頭 ───────────────────────────── */
  .masthead{
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
    padding: 34px 0 14px;
    border-bottom: 2px solid var(--ink);
  }
  .masthead h1{
    font-family: var(--serif);
    font-weight: 900;
    font-size: 30px;
    letter-spacing: .14em;
    margin: 0;
    line-height: 1;
  }
  .masthead h1 .en{
    display: block;
    font-family: var(--mono);
    font-weight: 400;
    font-size: 10.5px;
    letter-spacing: .3em;
    color: var(--ink-soft);
    margin-top: 9px;
  }
  .quote-state{
    font-family: var(--mono);
    font-size: 12px;
    color: var(--ink-soft);
    text-align: right;
    line-height: 1.7;
  }
  .quote-state b{
    display: block;
    color: var(--ink);
    font-weight: 500;
    letter-spacing: .04em;
  }
  .quote-state.off b{ color: var(--ink-soft); }

  /* ── 結存（蓋章式總覽） ─────────────── */
  .balance{
    border: 1px solid var(--rule);
    border-top: none;
    background: var(--paper-lit);
    display: grid;
    grid-template-columns: 1fr 1fr 1.4fr;
  }
  .cell{
    padding: 18px 20px 16px;
    border-right: 1px solid var(--rule-fine);
  }
  .cell:last-child{ border-right: none; }
  .cell .k{
    font-size: 11px;
    letter-spacing: .16em;
    color: var(--ink-soft);
    margin-bottom: 7px;
  }
  .cell .v{
    font-family: var(--mono);
    font-size: 23px;
    font-weight: 500;
    letter-spacing: -.01em;
  }
  .cell.total{
    background: var(--paper-deep);
    display: flex;
    align-items: baseline;
    gap: 16px;
    flex-wrap: wrap;
  }
  .cell.total .v{ font-size: 30px; }
  .cell.total .pct{
    font-family: var(--mono);
    font-size: 17px;
    font-weight: 500;
    padding: 1px 9px 2px;
    border: 1px solid currentColor;
  }
  .rise{ color: var(--rise); }
  .fall{ color: var(--fall); }
  .flat{ color: var(--ink); }

  /* ── 計息切換 ───────────────────────── */
  .basis{
    display: flex;
    align-items: center;
    gap: 14px;
    flex-wrap: wrap;
    padding: 13px 0 0;
    font-size: 12.5px;
    color: var(--ink-soft);
  }
  .seg{ display: inline-flex; border: 1px solid var(--ink); }
  .seg button{
    appearance: none;
    background: transparent;
    border: none;
    border-right: 1px solid var(--ink);
    font-family: var(--sans);
    font-size: 12.5px;
    color: var(--ink);
    padding: 5px 15px;
    cursor: pointer;
  }
  .seg button:last-child{ border-right: none; }
  .seg button[aria-pressed="true"]{ background: var(--ink); color: var(--paper); }
  button:focus-visible, input:focus-visible{
    outline: 2px solid var(--stamp);
    outline-offset: 1px;
  }

  /* ── 區段標題 ───────────────────────── */
  .band{
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
    margin: 40px 0 0;
    padding-bottom: 6px;
    border-bottom: 1px solid var(--ink);
  }
  .band h2{
    font-family: var(--serif);
    font-weight: 700;
    font-size: 16px;
    letter-spacing: .16em;
    margin: 0;
  }
  .band .aside{ font-size: 12px; color: var(--ink-soft); }

  /* ── 存摺表格 ───────────────────────── */
  .scroll{ overflow-x: auto; -webkit-overflow-scrolling: touch; }
  table{ width: 100%; border-collapse: collapse; }
  thead th{
    font-size: 10.5px;
    font-weight: 500;
    letter-spacing: .1em;
    color: var(--ink-soft);
    text-align: right;
    padding: 9px 11px;
    border-bottom: 1px solid var(--rule);
    white-space: nowrap;
  }
  thead th.l{ text-align: left; }
  tbody td{
    font-family: var(--mono);
    font-size: 13.5px;
    text-align: right;
    padding: 10px 11px;
    border-bottom: 1px solid var(--rule-fine);
    white-space: nowrap;
    vertical-align: middle;
  }
  tbody td.l{ text-align: left; font-family: var(--sans); }

  tr.entry{ background: var(--paper-lit); cursor: pointer; }
  tr.entry:hover{ background: #eaf0e8; }
  tr.entry td{
    border-bottom: 1px solid var(--rule);
    font-weight: 500;
  }
  tr.entry .sym{
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-family: var(--mono);
    font-weight: 500;
    letter-spacing: .02em;
  }
  .caret{
    color: var(--ink-soft);
    font-size: 9px;
    width: 8px;
    display: inline-block;
    transition: transform .16s ease;
  }
  tr.entry.shut .caret{ transform: rotate(-90deg); }
  .nil{ color: var(--rule); }

  tr.line td{ color: var(--ink); }
  tr.line .sym{ padding-left: 24px; color: var(--ink-soft); font-family: var(--mono); }
  tr.line .sub{
    display: block;
    font-family: var(--mono);
    font-size: 10.5px;
    color: var(--ink-soft);
    letter-spacing: .02em;
    margin-top: 1px;
  }
  tr.line.shut{ display: none; }

  /* 簽名：報酬率下方的刻度墨條 */
  .gauge{ display: inline-block; text-align: right; }
  .gauge .num{ display: block; }
  .gauge .rule{
    display: block;
    height: 2px;
    margin-top: 4px;
    margin-left: auto;
    background: currentColor;
    opacity: .55;
    min-width: 1px;
    transition: width .5s cubic-bezier(.2,.7,.3,1);
  }
  @media (prefers-reduced-motion: reduce){
    .gauge .rule{ transition: none; }
  }

  .pair{ display: inline-flex; align-items: center; justify-content: flex-end; gap: 5px; }
  .num-in{
    width: 74px;
    background: transparent;
    border: none;
    border-bottom: 1px solid var(--rule);
    font-family: var(--mono);
    font-size: 13.5px;
    color: var(--ink);
    text-align: right;
    padding: 1px 3px;
  }
  .num-in:focus{ outline: none; border-bottom: 1.5px solid var(--stamp); }
  .num-in.derived{ color: var(--ink-soft); }
  .tag{
    font-family: var(--mono);
    font-size: 9px;
    letter-spacing: .05em;
    color: var(--ink-soft);
    border: 1px solid var(--rule);
    padding: 0 4px;
    line-height: 15px;
  }
  .tag.own{ color: var(--stamp); border-color: var(--stamp); }
  .ghost{
    background: none; border: none; cursor: pointer;
    color: var(--ink-soft); font-size: 12px; padding: 0 3px; line-height: 1;
  }
  .ghost:hover{ color: var(--stamp); }
  .ghost.drop:hover{ color: var(--rise); }
  .pending{ display: block; font-size: 10.5px; color: var(--stamp); margin-top: 2px; }

  .blank td{
    text-align: center;
    font-family: var(--sans);
    color: var(--ink-soft);
    padding: 44px 16px;
    white-space: normal;
    border-bottom: 1px solid var(--rule-fine);
  }
  .blank strong{ display: block; color: var(--ink); font-weight: 500; margin-bottom: 4px; }

  /* ── 登錄表單 ───────────────────────── */
  .entry-form{
    border: 1px solid var(--rule);
    border-top: none;
    background: var(--paper-lit);
    padding: 20px;
  }
  .fields{
    display: grid;
    grid-template-columns: 108px minmax(150px,1fr) 96px 106px 148px auto;
    gap: 14px;
    align-items: end;
  }
  .f label{
    display: block;
    font-size: 11px;
    letter-spacing: .1em;
    color: var(--ink-soft);
    margin-bottom: 5px;
  }
  .f input{
    width: 100%;
    background: transparent;
    border: none;
    border-bottom: 1px solid var(--ink);
    font-family: var(--mono);
    font-size: 15px;
    color: var(--ink);
    padding: 6px 2px;
  }
  .f input::placeholder{ color: var(--rule); }
  .f input:focus{ outline: none; border-bottom: 2px solid var(--stamp); padding-bottom: 5px; }
  .f input[type=date]{ font-size: 13.5px; }
  .resolved{
    min-height: 34px;
    display: flex;
    align-items: center;
    gap: 8px;
    font-family: var(--sans);
    font-size: 15px;
    border-bottom: 1px solid var(--rule);
    padding-bottom: 6px;
  }
  .resolved.none{ color: var(--ink-soft); }
  .commit{
    appearance: none;
    background: var(--ink);
    color: var(--paper);
    border: none;
    font-family: var(--sans);
    font-size: 13.5px;
    font-weight: 500;
    letter-spacing: .08em;
    padding: 10px 22px;
    cursor: pointer;
  }
  .commit:hover{ background: var(--stamp); }
  .note{
    font-size: 12px;
    color: var(--ink-soft);
    line-height: 1.75;
    margin-top: 16px;
    padding-top: 14px;
    border-top: 1px solid var(--rule-fine);
  }
  .alert{
    font-size: 12.5px;
    color: var(--rise);
    margin-top: 12px;
    min-height: 19px;
  }

  .colophon{
    margin-top: 44px;
    padding-top: 14px;
    border-top: 1px solid var(--rule);
    font-family: var(--mono);
    font-size: 11px;
    color: var(--ink-soft);
    display: flex;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
  }

  @media (max-width: 860px){
    .sheet{ padding: 0 14px 72px; }
    .masthead{ padding-top: 24px; }
    .masthead h1{ font-size: 25px; }
    .balance{ grid-template-columns: 1fr 1fr; }
    .cell.total{ grid-column: 1 / -1; border-top: 1px solid var(--rule-fine); }
    .cell:nth-child(2){ border-right: none; }
    .fields{ grid-template-columns: 1fr 1fr; }
    .fields .f.wide, .fields .commit{ grid-column: 1 / -1; }
    .commit{ width: 100%; }
    .hide-sm{ display: none; }
  }
</style>
</head>
<body>
<div class="sheet">

  <header class="masthead">
    <h1>持股存摺<span class="en">HOLDINGS PASSBOOK</span></h1>
    <div class="quote-state" id="state"><b>載入中</b></div>
  </header>

  <section class="balance">
    <div class="cell">
      <div class="k">投入本金</div>
      <div class="v flat" id="vCost">$0</div>
    </div>
    <div class="cell">
      <div class="k">已領配息</div>
      <div class="v flat" id="vDiv">$0</div>
    </div>
    <div class="cell total">
      <div style="flex:1 1 auto">
        <div class="k" id="kGain">損益 · 含息</div>
        <div class="v flat" id="vGain">$0</div>
      </div>
      <div class="pct flat" id="vRate">0.00%</div>
    </div>
  </section>

  <div class="basis">
    <span class="seg" role="group" aria-label="報酬計算基準">
      <button id="bTotal" aria-pressed="true">含息</button>
      <button id="bPrice" aria-pressed="false">只看價差</button>
    </span>
    <span id="basisNote">配息已計入損益</span>
  </div>

  <div class="band">
    <h2>持股明細</h2>
    <span class="aside">點代號展開該檔的每一筆買進</span>
  </div>

  <div class="scroll">
    <table>
      <thead>
        <tr>
          <th class="l">代號</th>
          <th class="l">名稱</th>
          <th>股數</th>
          <th class="hide-sm">買進價</th>
          <th>現價</th>
          <th class="hide-sm">成本</th>
          <th>配息</th>
          <th>損益</th>
          <th>報酬率</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="book"></tbody>
    </table>
  </div>

  <div class="band"><h2>登錄一筆買進</h2></div>

  <section class="entry-form">
    <div class="fields">
      <div class="f">
        <label for="fCode">代號</label>
        <input id="fCode" type="text" maxlength="10" placeholder="2330" inputmode="numeric" autocomplete="off">
      </div>
      <div class="f">
        <label>名稱</label>
        <div class="resolved none" id="fName">輸入代號後自動帶出</div>
      </div>
      <div class="f">
        <label for="fShares">股數</label>
        <input id="fShares" type="number" min="0" placeholder="1000" inputmode="numeric">
      </div>
      <div class="f">
        <label for="fPrice">買進價</label>
        <input id="fPrice" type="number" min="0" step="0.01" placeholder="580.00" inputmode="decimal">
      </div>
      <div class="f">
        <label for="fDate">買進日</label>
        <input id="fDate" type="date">
      </div>
      <button class="commit" id="fAdd">登錄</button>
      <div class="f wide" id="fManualWrap" style="display:none">
        <label for="fManual">查無此代號，請自行填寫名稱</label>
        <input id="fManual" type="text" placeholder="例如 元大台灣50">
      </div>
    </div>
    <div class="alert" id="fAlert"></div>
    <p class="note">
      買進日決定哪幾次除息你有領到，留空則配息只能自行填寫。現價與配息都會自動帶入，
      直接在表格覆寫即為手動值，按 ↺ 還原成自動。台股慣例紅漲綠跌。
    </p>
  </section>

  <footer class="colophon">
    <span>資料存於本機瀏覽器，不會離開這台裝置</span>
    <span id="stampTime"></span>
  </footer>
</div>

<script>
"use strict";

const KEY_LOTS = "lots";
const KEY_BASIS = "returnMode";
const URL_PRICES = "prices.json";
const URL_DIVS = "dividends.json";

let lots = [];
let quotes = {};
let divsByCode = {};
let withDividend = true;
let firstPaint = true;
const shut = new Set();

/* ── 工具 ───────────────────────────── */
const money = n => (n < 0 ? "-" : "") + "$" + Math.abs(Math.round(n)).toLocaleString("en-US");
const pct = n => (n > 0 ? "+" : "") + n.toFixed(2) + "%";
/* 台股：漲紅跌綠 */
const tone = n => n > 0 ? "rise" : (n < 0 ? "fall" : "flat");
const esc = s => String(s).replace(/[&<>"']/g,
  c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
function today(){
  return new Date(Date.now() + 8 * 3600 * 1000).toISOString().slice(0, 10);
}

/* ── 報價與配息 ─────────────────────── */
const quoteOf = c => quotes[c] || null;
const nameOf = c => { const q = quoteOf(c); return q && q.name ? q.name : null; };

function priceOf(lot){
  if(lot.override !== null && lot.override !== undefined) return lot.override;
  const q = quoteOf(lot.code);
  return (q && typeof q.close === "number") ? q.close : lot.buyPrice;
}
function priceKind(lot){
  if(lot.override !== null && lot.override !== undefined) return "own";
  const q = quoteOf(lot.code);
  return (q && typeof q.close === "number") ? "auto" : "none";
}

/** 除息日需已過且不早於買進日；預告表含未來日期，不能先計入 */
function divEarned(lot){
  if(!lot.buyDate) return 0;
  const evs = divsByCode[lot.code];
  if(!evs) return 0;
  const t = today();
  return evs.reduce((s, e) =>
    (e.cash > 0 && e.exDate >= lot.buyDate && e.exDate <= t) ? s + e.cash * lot.shares : s, 0);
}
/** 已公告但尚未除息，僅供提示 */
function divPending(lot){
  if(!lot.buyDate) return 0;
  const evs = divsByCode[lot.code];
  if(!evs) return 0;
  const t = today();
  return evs.reduce((s, e) => (e.cash > 0 && e.exDate > t) ? s + e.cash * lot.shares : s, 0);
}
function divOf(lot){
  return (lot.dividend !== null && lot.dividend !== undefined) ? lot.dividend : divEarned(lot);
}
function divKind(lot){
  if(lot.dividend !== null && lot.dividend !== undefined) return "own";
  if(!lot.buyDate) return "nodate";
  return divEarned(lot) > 0 ? "auto" : "empty";
}

function calc(lot){
  const price = priceOf(lot);
  const cost = lot.shares * lot.buyPrice;
  const spread = (price - lot.buyPrice) * lot.shares;
  const dividend = divOf(lot);
  const gain = withDividend ? spread + dividend : spread;
  return { price, cost, spread, dividend, gain, rate: cost > 0 ? gain / cost * 100 : 0 };
}

/* ── 載入 ───────────────────────────── */
async function grab(url){
  const r = await fetch(url + "?t=" + Date.now(), { cache: "no-store" });
  if(!r.ok) throw new Error("HTTP " + r.status);
  return r.json();
}

async function loadFeeds(){
  const el = document.getElementById("state");
  let ok = false, head = "", tail = "";

  try{
    const d = await grab(URL_PRICES);
    quotes = d.prices || {};
    if(d.tradeDate && d.count > 0){
      ok = true;
      head = `收盤 ${esc(d.tradeDate)}`;
      tail = `${d.count.toLocaleString("en-US")} 檔自動報價`;
    } else {
      head = "尚無報價";
      tail = "等第一次排程更新";
    }
  }catch(e){
    quotes = {};
    head = "報價讀不到";
    tail = "現價請自行填寫";
  }

  try{
    const d = await grab(URL_DIVS);
    divsByCode = {};
    (d.events || []).forEach(e => (divsByCode[e.code] = divsByCode[e.code] || []).push(e));
    const n = (d.events || []).length;
    if(n) tail += ` · 除息 ${n} 筆`;
  }catch(e){ divsByCode = {}; }

  el.className = "quote-state" + (ok ? "" : " off");
  el.innerHTML = `<b>${head}</b>${esc(tail)}`;
}

/* ── 儲存 ───────────────────────────── */
function upgrade(list){
  return list.map(l => {
    const o = Object.assign({}, l);
    if(!Object.prototype.hasOwnProperty.call(o, "override")){
      const manual = typeof o.curPrice === "number" && o.curPrice !== o.buyPrice;
      o.override = manual ? o.curPrice : null;
      delete o.curPrice;
    }
    if(!Object.prototype.hasOwnProperty.call(o, "dividend")) o.dividend = null;
    if(!Object.prototype.hasOwnProperty.call(o, "buyDate")) o.buyDate = null;
    return o;
  });
}
function restore(){
  try{
    const raw = localStorage.getItem(KEY_LOTS);
    lots = raw ? upgrade(JSON.parse(raw)) : [];
  }catch(e){ lots = []; }
  try{ withDividend = localStorage.getItem(KEY_BASIS) !== "price"; }
  catch(e){ withDividend = true; }
}
function keep(){
  try{ localStorage.setItem(KEY_LOTS, JSON.stringify(lots)); }
  catch(e){ console.error("寫入失敗", e); }
}
function keepBasis(){
  try{ localStorage.setItem(KEY_BASIS, withDividend ? "total" : "price"); }catch(e){}
}

/* ── 繪製 ───────────────────────────── */
function paint(){
  let cost = 0, dividend = 0, gain = 0;
  lots.forEach(l => { const c = calc(l); cost += c.cost; dividend += c.dividend; gain += c.gain; });
  const rate = cost > 0 ? gain / cost * 100 : 0;

  document.getElementById("vCost").textContent = money(cost);
  document.getElementById("vDiv").textContent = money(dividend);

  const g = document.getElementById("vGain");
  g.textContent = money(gain);
  g.className = "v " + tone(gain);

  const r = document.getElementById("vRate");
  r.textContent = pct(rate);
  r.className = "pct " + tone(rate);

  document.getElementById("kGain").textContent = withDividend ? "損益 · 含息" : "損益 · 只看價差";
  document.getElementById("bTotal").setAttribute("aria-pressed", String(withDividend));
  document.getElementById("bPrice").setAttribute("aria-pressed", String(!withDividend));
  document.getElementById("basisNote").textContent =
    withDividend ? "配息已計入損益" : "損益只算價差，配息另外列";

  const book = document.getElementById("book");
  book.innerHTML = "";

  if(lots.length === 0){
    book.innerHTML = `<tr class="blank"><td colspan="10">
      <strong>存摺還是空的</strong>在下方登錄第一筆買進，這裡就會開始記帳。</td></tr>`;
    return;
  }

  /* 分組 */
  const order = [], group = {};
  lots.forEach(l => {
    if(!group[l.code]){
      group[l.code] = { code:l.code, name:l.name, shares:0, cost:0, value:0, dividend:0, rows:[] };
      order.push(l.code);
    }
    const c = calc(l), G = group[l.code];
    G.shares += l.shares; G.cost += c.cost;
    G.value += c.price * l.shares; G.dividend += c.dividend;
    G.rows.push(l);
    const fresh = nameOf(l.code);
    if(fresh) G.name = fresh;
  });

  /* 刻度以自己持股中最大報酬率為基準，至少 8% */
  const rates = order.map(c => {
    const G = group[c];
    const gg = (G.value - G.cost) + (withDividend ? G.dividend : 0);
    return G.cost > 0 ? Math.abs(gg / G.cost * 100) : 0;
  });
  const span = Math.max(8, ...rates);

  order.forEach(code => {
    const G = group[code];
    const gg = (G.value - G.cost) + (withDividend ? G.dividend : 0);
    const rr = G.cost > 0 ? gg / G.cost * 100 : 0;
    const closed = shut.has(code);
    const bar = Math.min(100, Math.abs(rr) / span * 100);

    const tr = document.createElement("tr");
    tr.className = "entry" + (closed ? " shut" : "");
    tr.tabIndex = 0;
    tr.innerHTML = `
      <td class="l"><span class="sym"><span class="caret">▼</span>${esc(G.code)}</span></td>
      <td class="l">${esc(G.name)}</td>
      <td>${G.shares.toLocaleString("en-US")}</td>
      <td class="hide-sm nil">—</td>
      <td class="nil">—</td>
      <td class="hide-sm">${money(G.cost)}</td>
      <td class="${G.dividend > 0 ? "" : "nil"}">${money(G.dividend)}</td>
      <td class="${tone(gg)}">${money(gg)}</td>
      <td class="${tone(rr)}"><span class="gauge">
        <span class="num">${pct(rr)}</span>
        <span class="rule" data-bar="${bar}" style="width:${firstPaint ? 0 : bar}%"></span>
      </span></td>
      <td></td>`;
    const flip = () => { shut.has(code) ? shut.delete(code) : shut.add(code); paint(); };
    tr.addEventListener("click", flip);
    tr.addEventListener("keydown", e => {
      if(e.key === "Enter" || e.key === " "){ e.preventDefault(); flip(); }
    });
    book.appendChild(tr);

    G.rows.forEach(l => {
      const c = calc(l);
      const pk = priceKind(l), dk = divKind(l);
      const pTag = pk === "own"
        ? `<span class="tag own">手動</span><button class="ghost" data-rp="${l.id}" title="還原自動報價" aria-label="還原自動報價">↺</button>`
        : `<span class="tag">${pk === "auto" ? "自動" : "無價"}</span>`;
      const dTag = dk === "own"
        ? `<span class="tag own">手動</span><button class="ghost" data-rd="${l.id}" title="還原自動計算" aria-label="還原自動計算">↺</button>`
        : `<span class="tag">${dk === "auto" ? "自動" : (dk === "nodate" ? "缺日期" : "無紀錄")}</span>`;
      const soon = divPending(l);
      const soonNote = (soon > 0 && dk !== "own")
        ? `<span class="pending">待除息 ${money(soon)}</span>` : "";

      const row = document.createElement("tr");
      row.className = "line" + (closed ? " shut" : "");
      row.innerHTML = `
        <td class="l"><span class="sym">${esc(l.code)}</span></td>
        <td class="l">${esc(l.name)}<span class="sub">${l.buyDate ? esc(l.buyDate) : "未填買進日"}</span></td>
        <td>${l.shares.toLocaleString("en-US")}</td>
        <td class="hide-sm">${l.buyPrice.toFixed(2)}</td>
        <td><span class="pair">
          <input class="num-in ${pk === "auto" ? "derived" : ""}" type="number" step="0.01"
                 value="${c.price}" data-price="${l.id}" inputmode="decimal" aria-label="現價">${pTag}</span></td>
        <td class="hide-sm">${money(c.cost)}</td>
        <td><span class="pair">
          <input class="num-in ${dk !== "own" ? "derived" : ""}" type="number" step="1"
                 value="${Math.round(c.dividend)}" data-div="${l.id}" inputmode="decimal" aria-label="配息">${dTag}</span>
          ${soonNote}</td>
        <td class="${tone(c.gain)}">${money(c.gain)}</td>
        <td class="${tone(c.gain)}">${pct(c.rate)}</td>
        <td><button class="ghost drop" data-del="${l.id}" title="刪除這筆" aria-label="刪除這筆">✕</button></td>`;
      book.appendChild(row);
    });
  });

  wire();

  if(firstPaint){
    firstPaint = false;
    requestAnimationFrame(() => {
      document.querySelectorAll(".gauge .rule").forEach(el => {
        el.style.width = el.dataset.bar + "%";
      });
    });
  }
  document.getElementById("stampTime").textContent = "檢視於 " + today();
}

const findLot = id => lots.find(x => String(x.id) === String(id));

function wire(){
  document.querySelectorAll(".num-in").forEach(i => {
    i.addEventListener("click", e => e.stopPropagation());
    i.addEventListener("change", e => {
      const t = e.target, lot = findLot(t.dataset.price || t.dataset.div);
      if(!lot) return;
      const v = parseFloat(t.value);
      if(t.dataset.price) lot.override = isNaN(v) ? null : v;
      else lot.dividend = isNaN(v) ? null : v;
      keep(); paint();
    });
  });
  const hook = (sel, fn) => document.querySelectorAll(sel).forEach(b =>
    b.addEventListener("click", e => { e.stopPropagation(); fn(e.currentTarget); }));
  hook("[data-rp]", b => { const l = findLot(b.dataset.rp); if(l){ l.override = null; keep(); paint(); } });
  hook("[data-rd]", b => { const l = findLot(b.dataset.rd); if(l){ l.dividend = null; keep(); paint(); } });
  hook("[data-del]", b => {
    lots = lots.filter(x => String(x.id) !== String(b.dataset.del));
    keep(); paint();
  });
}

/* ── 登錄表單 ───────────────────────── */
const fCode = document.getElementById("fCode");
const fName = document.getElementById("fName");
const fManualWrap = document.getElementById("fManualWrap");
const fManual = document.getElementById("fManual");
const fAlert = document.getElementById("fAlert");

function resolveName(){
  const code = fCode.value.trim();
  if(!code){
    fName.textContent = "輸入代號後自動帶出";
    fName.className = "resolved none";
    fManualWrap.style.display = "none";
    return;
  }
  const q = quoteOf(code);
  if(q && q.name){
    fName.innerHTML = `${esc(q.name)}<span class="tag">${esc(q.market || "")}</span>` +
      (typeof q.close === "number" ? `<span class="tag">收盤 ${q.close}</span>` : "");
    fName.className = "resolved";
    fManualWrap.style.display = "none";
  } else {
    fName.textContent = "查無此代號";
    fName.className = "resolved none";
    fManualWrap.style.display = "";
  }
}
fCode.addEventListener("input", resolveName);

document.getElementById("fAdd").addEventListener("click", () => {
  const code = fCode.value.trim();
  const shares = parseFloat(document.getElementById("fShares").value);
  const buyPrice = parseFloat(document.getElementById("fPrice").value);
  const buyDate = document.getElementById("fDate").value || null;

  if(!code){ fAlert.textContent = "還缺代號"; fCode.focus(); return; }
  if(!shares || shares <= 0){ fAlert.textContent = "股數要大於 0"; return; }
  if(!buyPrice || buyPrice <= 0){ fAlert.textContent = "買進價要大於 0"; return; }
  fAlert.textContent = "";

  lots.push({
    id: Date.now() + "-" + Math.random().toString(36).slice(2, 8),
    code,
    name: nameOf(code) || fManual.value.trim() || code,
    shares, buyPrice, buyDate,
    override: null, dividend: null
  });
  keep(); paint();

  fCode.value = "";
  document.getElementById("fShares").value = "";
  document.getElementById("fPrice").value = "";
  fManual.value = "";
  resolveName();
  fCode.focus();
});

document.getElementById("bTotal").addEventListener("click", () => {
  withDividend = true; keepBasis(); paint();
});
document.getElementById("bPrice").addEventListener("click", () => {
  withDividend = false; keepBasis(); paint();
});

/* ── 啟動 ───────────────────────────── */
(async function start(){
  restore();
  paint();
  await loadFeeds();
  paint();
  resolveName();
})();
</script>
</body>
</html>
