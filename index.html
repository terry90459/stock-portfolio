<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>持股帳本</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #10141c;
    --panel: #1a2130;
    --panel-alt: #212939;
    --line: #2e3648;
    --text: #eceff4;
    --muted: #8b95a8;
    --gold: #c9a24b;
    --gold-dim: #8a7238;
    --gain: #4ade9c;
    --loss: #ff6b6b;
    --font-display: 'Space Grotesk', 'Noto Sans TC', sans-serif;
    --font-body: 'Noto Sans TC', -apple-system, 'PingFang TC', sans-serif;
    --font-mono: 'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace;
  }
  *{ box-sizing: border-box; }
  body{
    margin:0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-body);
    min-height: 100vh;
  }
  /* ticker tape */
  .ticker-wrap{
    overflow:hidden;
    white-space:nowrap;
    background: var(--panel);
    border-bottom: 1px solid var(--line);
    padding: 7px 0;
  }
  .ticker-track{
    display:inline-block;
    white-space:nowrap;
    animation: scroll-left 32s linear infinite;
    font-family: var(--font-mono);
    font-size: 12px;
    letter-spacing: 0.03em;
    color: var(--muted);
  }
  .ticker-track span{ margin-right: 34px; }
  .ticker-track .t-code{ color: var(--gold); font-weight:600; }
  @keyframes scroll-left{
    from{ transform: translateX(0); }
    to{ transform: translateX(-50%); }
  }

  .wrap{
    max-width: 1040px;
    margin: 0 auto;
    padding: 28px 20px 80px;
  }
  .masthead{
    display:flex;
    align-items:baseline;
    justify-content: space-between;
    margin-bottom: 22px;
    border-bottom: 1px solid var(--line);
    padding-bottom: 16px;
  }
  .masthead h1{
    font-family: var(--font-display);
    font-size: 26px;
    font-weight: 700;
    letter-spacing: 0.01em;
    margin:0;
  }
  .masthead .dot{
    display:inline-block;
    width:7px; height:7px;
    border-radius:50%;
    background: var(--gain);
    margin-right:9px;
    box-shadow: 0 0 0 3px rgba(74,222,156,0.15);
  }
  .masthead .date{
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--muted);
  }

  /* summary strip */
  .summary{
    display:grid;
    grid-template-columns: 1fr 1fr 1fr;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    overflow:hidden;
    margin-bottom: 28px;
  }
  .stat{
    padding: 18px 20px;
    border-right: 1px solid var(--line);
  }
  .stat:last-child{ border-right:none; }
  .stat .label{
    font-size: 12px;
    color: var(--muted);
    letter-spacing: 0.04em;
    margin-bottom: 8px;
  }
  .stat .value{
    font-family: var(--font-mono);
    font-size: 24px;
    font-weight: 600;
    display:flex;
    align-items:center;
    gap:6px;
  }
  .stat .value.gain{ color: var(--gain); }
  .stat .value.loss{ color: var(--loss); }
  .stat .value.neutral{ color: var(--text); }
  .arrow{ font-size: 15px; }

  section{ margin-bottom: 32px; }
  .section-title{
    font-family: var(--font-display);
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0.02em;
    color: var(--gold);
    margin-bottom: 12px;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .section-title::before{
    content:"";
    width:3px; height:14px;
    background: var(--gold);
    display:inline-block;
  }

  /* form */
  .form-card{
    background: var(--panel-alt);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 18px;
  }
  .form-grid{
    display:grid;
    grid-template-columns: 100px 1fr 90px 110px 110px auto;
    gap: 10px;
    align-items:end;
  }
  .field label{
    display:block;
    font-size: 11px;
    color: var(--muted);
    margin-bottom: 6px;
    letter-spacing: 0.03em;
  }
  .field input{
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 6px;
    color: var(--text);
    font-family: var(--font-mono);
    font-size: 14px;
    padding: 9px 10px;
    transition: border-color .15s;
  }
  .field input:focus{
    outline:none;
    border-color: var(--gold-dim);
  }
  .field.name-preview{
    font-family: var(--font-body);
  }
  .name-tag{
    height: 38px;
    display:flex; align-items:center;
    color: var(--text);
    font-size: 14px;
    padding: 0 2px;
  }
  .name-tag.unknown{ color: var(--muted); font-style: italic; }
  .add-btn{
    background: var(--gold);
    color: #1a1406;
    border: none;
    border-radius: 6px;
    padding: 9px 18px;
    font-family: var(--font-body);
    font-weight: 700;
    font-size: 13px;
    cursor:pointer;
    white-space:nowrap;
    height: 38px;
    transition: filter .15s;
  }
  .add-btn:hover{ filter: brightness(1.1); }
  .add-btn:disabled{ opacity: .4; cursor: not-allowed; }
  .hint{
    font-size: 11px;
    color: var(--muted);
    margin-top: 10px;
  }

  /* table */
  table{
    width: 100%;
    border-collapse: collapse;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    overflow: hidden;
  }
  thead th{
    text-align: right;
    font-size: 11px;
    font-weight: 600;
    color: var(--muted);
    letter-spacing: 0.03em;
    padding: 10px 14px;
    border-bottom: 1px solid var(--line);
    background: var(--panel-alt);
  }
  thead th.left{ text-align:left; }
  tbody td{
    text-align: right;
    padding: 11px 14px;
    font-family: var(--font-mono);
    font-size: 13px;
    border-bottom: 1px solid var(--line);
  }
  tbody tr:last-child td{ border-bottom: none; }
  tbody td.left{ text-align:left; font-family: var(--font-body); }
  tbody tr:hover{ background: rgba(255,255,255,0.02); }
  .code-cell{ color: var(--gold); font-weight:600; }
  .gain-text{ color: var(--gain); }
  .loss-text{ color: var(--loss); }
  .cur-price-input{
    width: 78px;
    background: transparent;
    border: 1px solid transparent;
    border-bottom: 1px dashed var(--line);
    color: var(--text);
    font-family: var(--font-mono);
    font-size: 13px;
    text-align: right;
    padding: 2px 4px;
  }
  .cur-price-input:focus{
    outline:none;
    border-bottom: 1px solid var(--gold-dim);
  }
  .del-btn{
    background:none;
    border:none;
    color: var(--muted);
    cursor:pointer;
    font-size: 15px;
    padding: 2px 6px;
    line-height:1;
  }
  .del-btn:hover{ color: var(--loss); }
  tr.group-row{
    background: var(--panel-alt);
    cursor: pointer;
  }
  tr.group-row:hover{ background: rgba(201,162,75,0.08); }
  tr.group-row td{
    font-weight: 600;
    border-bottom: 1px solid var(--line);
  }
  tr.group-row .code-cell{
    display:flex;
    align-items:center;
    gap:7px;
  }
  .toggle-chevron{
    display:inline-block;
    color: var(--gold);
    font-size: 10px;
    transition: transform .15s;
    width: 10px;
  }
  tr.group-row.collapsed .toggle-chevron{ transform: rotate(-90deg); }
  .muted-cell{ color: var(--muted); }
  tr.detail-row td{
    font-weight: 400;
    color: var(--muted);
  }
  tr.detail-row .code-cell{
    padding-left: 26px;
    color: var(--muted);
    font-weight: 400;
  }
  tr.detail-row td.left:nth-child(2){ color: var(--muted); }
  tr.detail-row .cur-price-input,
  tr.detail-row td:not(.left){ color: var(--text); }
  tr.detail-row .gain-text,
  tr.detail-row .loss-text{ font-weight: 500; }
  tr.detail-row.hidden-row{ display:none; }
  .empty-row td{
    text-align:center;
    color: var(--muted);
    font-family: var(--font-body);
    padding: 26px 14px;
  }
  .table-scroll{ overflow-x:auto; }
  @media (max-width: 720px){
    .form-grid{ grid-template-columns: 1fr 1fr; }
    table{ font-size: 12px; }
  }
</style>
</head>
<body>

<div class="ticker-wrap">
  <div class="ticker-track" id="tickerTrack"></div>
</div>

<div class="wrap">
  <div class="masthead">
    <h1><span class="dot"></span>持股帳本</h1>
    <div class="date" id="todayDate"></div>
  </div>

  <div class="summary">
    <div class="stat">
      <div class="label">總投入金額</div>
      <div class="value neutral" id="sumInvested">$0</div>
    </div>
    <div class="stat">
      <div class="label">總收益金額</div>
      <div class="value neutral" id="sumGain">$0</div>
    </div>
    <div class="stat">
      <div class="label">總收益率</div>
      <div class="value neutral" id="sumRate">0.00%</div>
    </div>
  </div>

  <section>
    <div class="section-title">新增持股</div>
    <div class="form-card">
      <div class="form-grid">
        <div class="field">
          <label>股票代號</label>
          <input type="text" id="inCode" placeholder="2330" maxlength="10">
        </div>
        <div class="field name-preview">
          <label>名稱</label>
          <div class="name-tag" id="namePreview">請輸入代號</div>
        </div>
        <div class="field" id="customNameField" style="display:none;">
          <label>自訂名稱</label>
          <input type="text" id="inCustomName" placeholder="輸入名稱">
        </div>
        <div class="field">
          <label>股數</label>
          <input type="number" id="inShares" placeholder="1000" min="0">
        </div>
        <div class="field">
          <label>買入價格</label>
          <input type="number" id="inBuyPrice" placeholder="580.00" min="0" step="0.01">
        </div>
        <div>
          <button class="add-btn" id="addBtn">+ 新增持股</button>
        </div>
      </div>
      <div class="hint">目前價格新增後可於下方明細表直接編輯，用來即時計算收益。找不到代號的中文名稱時，可於「自訂名稱」欄位手動輸入。</div>
    </div>
  </section>

  <section>
    <div class="section-title">持股明細</div>
    <div class="hint" style="margin-bottom:10px;">每個代號上方為統整列（股數合計／總價金／收益金額／收益率），點擊可展開／收合底下各筆買入明細。</div>
    <div class="table-scroll">
      <table>
        <thead>
          <tr>
            <th class="left">代號</th>
            <th class="left">名稱</th>
            <th>股數</th>
            <th>買入價格</th>
            <th>目前價格</th>
            <th>總價金</th>
            <th>收益金額</th>
            <th>收益率</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="lotsBody">
        </tbody>
      </table>
    </div>
  </section>

</div>

<script>
const STOCK_NAMES = {
  "2330":"台積電","2317":"鴻海","2454":"聯發科","2412":"中華電","2308":"台達電",
  "2882":"國泰金","2881":"富邦金","1301":"台塑","1303":"南亞","2002":"中鋼",
  "2891":"中信金","2886":"兆豐金","2884":"玉山金","2892":"第一金","5880":"合庫金",
  "2880":"華南金","2885":"元大金","2887":"台新金","2890":"永豐金","2883":"開發金",
  "3008":"大立光","2303":"聯電","2379":"瑞昱","2382":"廣達","2357":"華碩",
  "2395":"研華","3711":"日月光投控","2409":"友達","2408":"南亞科","1216":"統一",
  "1101":"台泥","1102":"亞泥","2207":"和泰車","9910":"豐泰","2201":"裕隆",
  "2603":"長榮","2609":"陽明","2615":"萬海","2610":"華航","2618":"長榮航",
  "1402":"遠東新","1326":"台化","6505":"台塑化","2912":"統一超","9904":"寶成",
  "2801":"彰銀","5871":"中租-KY","4938":"和碩","3045":"台灣大","4904":"遠傳",
  "2345":"智邦","3231":"緯創","2377":"微星","2376":"技嘉","6446":"藥華藥",
  "3661":"世芯-KY","6415":"矽力*-KY","00878":"國泰永續高股息","0050":"元大台灣50",
  "0056":"元大高股息","006208":"富邦台50","2354":"鴻準","2327":"國巨","3037":"欣興",
  "6669":"緯穎","2382":"廣達","2360":"致茂","3406":"玉晶光","4966":"譜瑞-KY"
};

const STORAGE_KEY = "lots";
let lots = [];
const collapsedCodes = new Set();

function fmtMoney(n){
  const sign = n < 0 ? "-" : "";
  return sign + "$" + Math.abs(Math.round(n)).toLocaleString("en-US");
}
function fmtRate(n){
  const sign = n > 0 ? "+" : "";
  return sign + n.toFixed(2) + "%";
}
function gainClass(n){
  return n > 0 ? "gain-text" : (n < 0 ? "loss-text" : "");
}
function arrow(n){
  return n > 0 ? "▲" : (n < 0 ? "▼" : "—");
}

function lookupName(code){
  return STOCK_NAMES[code] || null;
}

function computeLot(lot){
  const totalCost = lot.shares * lot.buyPrice;
  const gain = (lot.curPrice - lot.buyPrice) * lot.shares;
  const rate = lot.buyPrice > 0 ? (gain / totalCost) * 100 : 0;
  return { totalCost, gain, rate };
}

function render(){
  // summary
  let totalInvested = 0, totalGain = 0;
  lots.forEach(l => {
    const c = computeLot(l);
    totalInvested += c.totalCost;
    totalGain += c.gain;
  });
  const totalRate = totalInvested > 0 ? (totalGain / totalInvested) * 100 : 0;

  document.getElementById("sumInvested").textContent = fmtMoney(totalInvested);
  const gainEl = document.getElementById("sumGain");
  gainEl.textContent = fmtMoney(totalGain);
  gainEl.className = "value " + (totalGain > 0 ? "gain" : totalGain < 0 ? "loss" : "neutral");
  const rateEl = document.getElementById("sumRate");
  rateEl.innerHTML = fmtRate(totalRate) + ` <span class="arrow">${arrow(totalRate)}</span>`;
  rateEl.className = "value " + (totalRate > 0 ? "gain" : totalRate < 0 ? "loss" : "neutral");

  // grouped table: 統整列 + 可展開明細列
  const body = document.getElementById("lotsBody");
  body.innerHTML = "";

  if(lots.length === 0){
    body.innerHTML = `<tr class="empty-row"><td colspan="9">尚未新增任何持股，於上方輸入代號開始建立庫存。</td></tr>`;
    buildTicker();
    return;
  }

  // 依代號分組，保留原始出現順序
  const order = [];
  const groups = {};
  lots.forEach(l => {
    if(!groups[l.code]){
      groups[l.code] = { code: l.code, name: l.name, shares: 0, totalCost: 0, currentValue: 0, lots: [] };
      order.push(l.code);
    }
    const c = computeLot(l);
    groups[l.code].shares += l.shares;
    groups[l.code].totalCost += c.totalCost;
    groups[l.code].currentValue += l.curPrice * l.shares;
    groups[l.code].lots.push(l);
  });

  order.forEach(code => {
    const g = groups[code];
    const gain = g.currentValue - g.totalCost;
    const rate = g.totalCost > 0 ? (gain / g.totalCost) * 100 : 0;
    const isCollapsed = collapsedCodes.has(code);

    const groupTr = document.createElement("tr");
    groupTr.className = "group-row" + (isCollapsed ? " collapsed" : "");
    groupTr.dataset.code = code;
    groupTr.innerHTML = `
      <td class="left"><span class="code-cell"><span class="toggle-chevron">▾</span>${g.code}</span></td>
      <td class="left">${g.name}</td>
      <td>${g.shares.toLocaleString("en-US")}</td>
      <td class="muted-cell">—</td>
      <td class="muted-cell">—</td>
      <td>${fmtMoney(g.totalCost)}</td>
      <td class="${gainClass(gain)}">${fmtMoney(gain)}</td>
      <td class="${gainClass(gain)}">${fmtRate(rate)}</td>
      <td></td>
    `;
    groupTr.addEventListener("click", () => {
      if(collapsedCodes.has(code)){ collapsedCodes.delete(code); }
      else{ collapsedCodes.add(code); }
      render();
    });
    body.appendChild(groupTr);

    g.lots.forEach(l => {
      const c = computeLot(l);
      const tr = document.createElement("tr");
      tr.className = "detail-row" + (isCollapsed ? " hidden-row" : "");
      tr.dataset.code = code;
      tr.innerHTML = `
        <td class="left"><span class="code-cell">${l.code}</span></td>
        <td class="left">${l.name}</td>
        <td>${l.shares.toLocaleString("en-US")}</td>
        <td>${l.buyPrice.toFixed(2)}</td>
        <td><input class="cur-price-input" type="number" step="0.01" value="${l.curPrice}" data-id="${l.id}"></td>
        <td>${fmtMoney(c.totalCost)}</td>
        <td class="${gainClass(c.gain)}">${fmtMoney(c.gain)}</td>
        <td class="${gainClass(c.gain)}">${fmtRate(c.rate)}</td>
        <td><button class="del-btn" data-id="${l.id}" title="刪除">✕</button></td>
      `;
      body.appendChild(tr);
    });
  });

  // rebind current-price inputs & delete buttons
  document.querySelectorAll(".cur-price-input").forEach(inp => {
    inp.addEventListener("click", (e) => e.stopPropagation());
    inp.addEventListener("change", (e) => {
      const id = e.target.dataset.id;
      const val = parseFloat(e.target.value) || 0;
      const lot = lots.find(x => String(x.id) === String(id));
      if(lot){ lot.curPrice = val; save(); render(); }
    });
  });
  document.querySelectorAll(".del-btn").forEach(btn => {
    btn.addEventListener("click", (e) => {
      e.stopPropagation();
      const id = e.target.dataset.id;
      lots = lots.filter(x => String(x.id) !== String(id));
      save(); render();
    });
  });

  buildTicker();
}

function buildTicker(){
  const track = document.getElementById("tickerTrack");
  if(lots.length === 0){
    track.innerHTML = `<span>尚無持股資料 — 於下方新增你的第一筆股票</span>`;
    return;
  }
  const uniq = {};
  lots.forEach(l => { uniq[l.code] = l.name; });
  let html = "";
  Object.keys(uniq).forEach(code => {
    const l = lots.filter(x => x.code === code);
    const totalCost = l.reduce((s,x)=>s + x.shares*x.buyPrice, 0);
    const curVal = l.reduce((s,x)=>s + x.shares*x.curPrice, 0);
    const rate = totalCost > 0 ? ((curVal-totalCost)/totalCost*100) : 0;
    html += `<span><span class="t-code">${code}</span> ${uniq[code]} ${fmtRate(rate)} ${arrow(rate)}</span>`;
  });
  track.innerHTML = html + html; // duplicate for seamless loop
}

async function load(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){ lots = JSON.parse(raw); }
  }catch(e){
    lots = [];
  }
  render();
}

async function save(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(lots));
  }catch(e){
    console.error("儲存失敗", e);
  }
}

// name preview logic
const inCode = document.getElementById("inCode");
const namePreview = document.getElementById("namePreview");
const customField = document.getElementById("customNameField");
const inCustomName = document.getElementById("inCustomName");

inCode.addEventListener("input", () => {
  const code = inCode.value.trim();
  if(!code){
    namePreview.textContent = "請輸入代號";
    namePreview.className = "name-tag unknown";
    customField.style.display = "none";
    return;
  }
  const name = lookupName(code);
  if(name){
    namePreview.textContent = name;
    namePreview.className = "name-tag";
    customField.style.display = "none";
  } else {
    namePreview.textContent = "找不到，請手動輸入";
    namePreview.className = "name-tag unknown";
    customField.style.display = "";
  }
});

document.getElementById("addBtn").addEventListener("click", () => {
  const code = inCode.value.trim();
  const shares = parseFloat(document.getElementById("inShares").value);
  const buyPrice = parseFloat(document.getElementById("inBuyPrice").value);
  if(!code || !shares || !buyPrice){
    alert("請完整輸入股票代號、股數與買入價格");
    return;
  }
  let name = lookupName(code);
  if(!name){
    name = inCustomName.value.trim() || code;
  }
  lots.push({
    id: Date.now() + Math.random(),
    code, name, shares, buyPrice, curPrice: buyPrice
  });
  save(); render();

  inCode.value = "";
  document.getElementById("inShares").value = "";
  document.getElementById("inBuyPrice").value = "";
  inCustomName.value = "";
  namePreview.textContent = "請輸入代號";
  namePreview.className = "name-tag unknown";
  customField.style.display = "none";
});

document.getElementById("todayDate").textContent = new Date().toLocaleDateString("zh-TW", { year:"numeric", month:"2-digit", day:"2-digit" });

load();
</script>
</body>
</html>
